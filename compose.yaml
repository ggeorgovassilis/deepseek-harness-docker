services:
  deepseek-harness:
    build:
      context: .
      # Tags the locally built image WITHOUT the content digest (Docker refuses
      # to tag a build output with a digest). The runtime `image:` below keeps
      # the digest so `pull`/`up` stay pinned to the immutable content.
      tags:
        - ${DSH_IMAGE_REPOSITORY:-docker.io/runzhliu/deepseek-harness}:${DSH_IMAGE_VERSION:-0.2.1-rc.2-r1}
      args:
        DSH_VERSION: ${DSH_VERSION:-0.2.1-rc.2}
        IMAGE_VERSION: ${DSH_IMAGE_VERSION:-0.2.1-rc.2-r1}
        NODE_IMAGE: ${NODE_IMAGE:-docker.io/library/node:24-trixie}
        PNPM_VERSION: ${PNPM_VERSION:-11.19.0}
    image: ${DSH_IMAGE_REPOSITORY:-docker.io/runzhliu/deepseek-harness}:${DSH_IMAGE_VERSION:-0.2.1-rc.2-r1}${DSH_IMAGE_DIGEST:+@${DSH_IMAGE_DIGEST}}
    command:
      - web
      - --patch
      - /opt/deepseek-harness/web.cordis.patch.yml
      - --no-open
      - --trusted-host
      - ${DSH_WEB_TRUSTED_HOST:-127.0.0.1}
      - --trusted-host
      - ${DSH_LAN_HOST:-127.0.0.1}
    ports:
      - "${DSH_PORT:-3080}:3080"
      - "${DSH_DESKTOP_PORT:-6080}:6080"
    environment:
      DSH_TELEMETRY_DISABLED: "1"
      DSH_DESKTOP_ENABLED: "1"
      DSH_BROWSER_USE_ENABLED: ${DSH_BROWSER_USE_ENABLED:-1}
      # The relay needs exactly one interface. With an extra network attached,
      # Docker assigns eth0/eth1 non-deterministically, so the entrypoint
      # auto-detects the default-network interface via the default route.
      # Set this only to override that detection.
      DSH_WEB_RELAY_INTERFACE: ${DSH_WEB_RELAY_INTERFACE:-}
      DSH_DESKTOP_PUBLIC_PORT: ${DSH_DESKTOP_PORT:-6080}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GH_TOKEN: ${GH_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # gh reads its token from this file (see entrypoint) because DSH scrubs
      # *TOKEN* env vars from agent shells. Lives in the dsh-home volume.
      GH_CONFIG_DIR: /home/node/.dsh/gh
      HOME: /workspace
    volumes:
      - dsh-home:/home/node/.dsh
      - ${DSH_WORKSPACE:-dsh-workspace}:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/local/bin/docker:ro
      # The VS Code extension addresses DSH by host filesystem paths. Bind the
      # host workspace at the SAME absolute path so those paths resolve inside
      # the container. Leave unset if you do not use the extension.
      - ${DSH_HOST_PATH:-/opt/dsh-host-path}:${DSH_HOST_PATH:-/opt/dsh-host-path}
    networks:
      - default
      - ebay-mcp-network
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    # Chromium uses /dev/shm for renderer processes. This mirrors the useful
    # runtime setting from docker-antigravity without adopting its amd64-only
    # desktop base image.
    shm_size: "1gb"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "Promise.all([fetch('http://127.0.0.1:3080/'), fetch('http://127.0.0.1:6080/vnc.html'), fetch('http://127.0.0.1:9222/json/version')]).then(([web, desktop, cdp]) => { if (web.status !== 401 || !desktop.ok || !cdp.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 5
    group_add: [984]
volumes:
  dsh-home:
  dsh-workspace:

networks:
  # Pre-existing bridge shared with the eBay MCP stack. Declared external so
  # Compose attaches to it instead of creating a new one.
  ebay-mcp-network:
    external: true
    name: ebay_mcp_network
